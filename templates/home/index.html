{% extends "base/base.html" %}

{% block start %}

<!-- slick carousel -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.9.0/slick.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.9.0/slick-theme.css">

<!-- slider -->

<div class="container mt-4 pt-4">
    <div class="slider">
        {% for product in products %}
        <div>
            <figure class="card card-product-grid">
                <div class="img-wrap">
                    {% with img=product.product_images.first %}{% if img %}<img src="{{ img.image.url }}" alt="{{ product.product_name }}">{% endif %}{% endwith %}
                </div>
                <figcaption class="info-wrap border-top">
                    <a href="{% url 'get_product' product.slug %}" class="title">{{ product.product_name }}</a>
                    <div class="price mt-2">₹{{ product.price }}.00</div>
                </figcaption>
            </figure>
        </div>
        {% endfor %}
    </div>
</div>


<!-- all products -->
<div class="container mt-4 pt-4">
    <h2 class="text-center mt-2 p-2">All Products</h2>
    <div class="row">

        {% for product in products %}
        <div class="col-md-4 mb-4">
            <figure class="card card-product-grid">
                <div class="img-wrap">
                    {% with img=product.product_images.first %}{% if img %}<img src="{{ img.image.url }}" alt="{{ product.product_name }}">{% endif %}{% endwith %}
                </div>
                <figcaption class="info-wrap border-top">
                    <a href="{% url 'get_product' product.slug %}" class="title">{{ product.product_name }}</a>
                    <div class="price mt-2">₹{{ product.price }}.00</div>
                </figcaption>
            </figure>
        </div>
        {% endfor %}
    </div>
</div>

<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.9.0/slick.min.js"></script>
<script type="text/javascript">
    $(document).ready(function(){
        $('.slider').slick({
            slidesToShow: 4,
            slidesToScroll: 1,
            dots: true,
            infinite: true,
            speed: 300,
            autoplay: true,
            autoplaySpeed: 2000,
            responsive: [
                { breakpoint: 1024, settings: { slidesToShow: 3, slidesToScroll: 1, infinite: true, dots: true } },
                { breakpoint: 768,  settings: { slidesToShow: 2, slidesToScroll: 1, infinite: true, dots: true } },
                { breakpoint: 576,  settings: { slidesToShow: 1, slidesToScroll: 1, infinite: true, dots: true } }
            ]
        });
    });
</script>

{% endblock %}
